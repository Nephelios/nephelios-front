name: Nephelios-Front CI Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "ci-release.yml"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "ci-release.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container # Utilisation du bon driver pour gérer le cache

      - name: Dockerhub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_NEPHELIOS_FRONT_USER }}
          password: ${{ secrets.DOCKER_NEPHELIOS_FRONT_TOKEN }}

      - name: Build Docker image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: zuhowks/nephelios-front:unstable
          cache-from: type=gha
          cache-to: type=gha,mode=max
          github-token: ${{ secrets.TOKEN_GITHUB }}
          load: true
